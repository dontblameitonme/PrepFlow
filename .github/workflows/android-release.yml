name: Android Release arm64-v8a

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "追加的 Release 说明（可留空）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Prepare signing config
        working-directory: apps/android
        run: |
          keytool -genkeypair -v -keystore signing.jks -alias shiroha -keyalg RSA -keysize 2048 -validity 10000 -storepass shiroha2026 -keypass shiroha2026 -dname "CN=Shiroha Quiz, OU=PrepFlow, O=PrepFlow, L=NA, ST=NA, C=CN"
          printf 'storeFile=signing.jks\nstorePassword=shiroha2026\nkeyAlias=shiroha\nkeyPassword=shiroha2026\n' > keystore.properties

      - name: Build native release APK
        working-directory: apps/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:assembleNativeRelease --no-daemon --stacktrace

      - name: Collect APK
        id: collect
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' apps/android/app/build.gradle.kts | tail -1)
          SRC=$(find apps/android/app/build/outputs/apk/native/release -name "*.apk" | head -1)
          OUT="Shiroha-Quiz-v${VERSION}-native-arm64-v8a.apk"
          cp "$SRC" "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiroha-quiz-native-arm64-v8a
          path: |
            Shiroha-Quiz-*.apk
            Shiroha-Quiz-*.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.collect.outputs.version }}
          APK: ${{ steps.collect.outputs.apk }}
          EXTRA_NOTES: ${{ inputs.release_notes }}
        run: |
          TAG="v${VERSION}-m3"
          if [ -n "$EXTRA_NOTES" ]; then
            printf '\n%s\n' "$EXTRA_NOTES" >> .github/release-notes-m3.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
            gh release edit "$TAG" --notes-file .github/release-notes-m3.md --title "Shiroha Quiz ${VERSION} · Material You"
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --title "Shiroha Quiz ${VERSION} · Material You" --notes-file .github/release-notes-m3.md
          fi
